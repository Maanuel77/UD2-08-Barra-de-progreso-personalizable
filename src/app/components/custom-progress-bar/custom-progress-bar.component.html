<div class="progress" role="progressbar" aria-label="Barra de progreso"
     [style.height.px]="height()"
     [attr.aria-valuenow]="value()" aria-valuemin="0" aria-valuemax="100">
  <div [class]="barClasses()"
       [style.width.%]="value()"
       [style.background-color]="isBootstrapColor() ? null : color()">
    @if (showLabel()) {
      {{ value() }}%
    }
  </div>
</div>
